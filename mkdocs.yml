site_name: Aaron Huntley
site_url: https://aaron-huntley.github.io/mathematics/
theme:
  name: material
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: deep orange
      accent: amber

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: cyan
      accent: light green
  logo: images/logo.png
  favicon: images/favicon.png
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
nav:
  - Home: index.md
  - About me:
    - CV: cv/education.md
  - Conversations with friends:
    - blog/index.md
plugins:
  - blog:
      draft_on_serve: false
  - mkdocs-pyscript
markdown_extensions:
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
