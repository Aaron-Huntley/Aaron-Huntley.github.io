site_name: Aaron Huntley
site_url: https://aaron-huntley.github.io/
theme:
  name: material
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: deep orange
      accent: amber

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: cyan
      accent: light green
  logo: images/logo.png
  favicon: images/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
exclude_docs: |
  calc3/
nav:
  - Home: index.md
  - About me:
    - CV: aboutme/cv.md
    - Talks: aboutme/talks.md
  - Conversations with friends:
    - blog/index.md
plugins:
  - material/blog:
      draft_on_serve: false
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - md_in_html
  - attr_list
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
